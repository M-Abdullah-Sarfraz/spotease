<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Status - SpotEase</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f4f4;
    }
  
    /* Header Styling */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #003466;
      color: white;
      padding: 10px 20px;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }
    .nav a:hover {
      text-decoration: underline;
    }
  
    .right-buttons {
      display: flex;
      align-items: center;
      gap: 15px;
    }
  
    /* Stylish Post Button */
    .post-button {
      background: linear-gradient(135deg, #ff9800, #ffc107);
      color: white;
      font-weight: bold;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }
  
    .post-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 200%;
      height: 100%;
      background: linear-gradient(120deg, rgba(255,255,255,0.2), transparent);
      transition: all 0.5s ease;
    }
  
    .post-button:hover::before {
      left: 100%;
    }
  
    .post-button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 14px rgba(255, 193, 7, 0.4);
    }
  
    /* Profile Button */
    .profile-menu {
      position: relative;
    }
  
    .profile-button {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: white;
      color: #003466;
      border: none;
      padding: 6px 12px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: background-color 0.3s;
    }
  
    .profile-button:hover {
      background-color: #f1f1f1;
    }
  
    .profile-avatar {
      background-color: #003466;
      color: white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
  
    /* Booking Section */
    .container {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    }
  
    h1 {
      text-align: center;
      color: #003466;
      margin-bottom: 30px;
    }
  
    .booking {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 15px 0;
    }
  
    .booking-info p {
      margin: 4px 0;
      font-size: 15px;
      color: #333;
    }
  
    .status {
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
    }
  
    .pending {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }
  
    .confirmed {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
  
    .rejected {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  
    @media (max-width: 600px) {
      .booking {
        flex-direction: column;
        align-items: flex-start;
      }
  
      .status {
        margin-top: 10px;
      }
    }
  
    /* Dropdown */
    .dropdown {
      display: none;
      position: absolute;
      top: 45px;
      right: 0;
      background-color: white;
      color: #333;
      min-width: 180px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
      border-radius: 10px;
      overflow: hidden;
      z-index: 999;
      font-size: 14px;
    }
  
    .dropdown a {
      display: block;
      padding: 12px 16px;
      text-decoration: none;
      color: #333;
      border-bottom: 1px solid #eee;
      transition: background 0.2s;
    }
  
    .dropdown a:hover {
      background-color: #f9f9f9;
    }
  
    .dropdown a:last-child {
      border-bottom: none;
    }
  </style>
  
</head>
<body>

<header class="header">
    <div class="logo">SpotEase</div>
    <nav class="nav">
        <a href="{% url 'home:home' %}">Home</a>
        <a href="{% url 'home:aboutus' %}">About Us</a>
        <a href="{% url 'home:contactus' %}">Contact Us</a>
    </nav>
    <div class="right-buttons">

        <a href="{% url 'ads:choose_category' %}">
            <button class="post-button">
            + Post
            </button>
        </a>

        <!-- Profile Button -->
        <div class="profile-menu">
            <button class="profile-button" onclick="toggleDropdown()">
                <div class="profile-avatar">{{ user.username|slice:":1" }}</div> 
                <span id="username">{{ user.username }}</span>  
            </button>
            <div class="dropdown" id="profileDropdown">
              <a href="{% url 'home:edit_profile' %}">Edit Profile</a>
              <a href="{% url 'home:check_booking_status' %}">Check Booking Status</a>
              <a href="{% url 'home:my_ads' %}">My Ads</a>
              <a href="{% url 'home' %}">Logout</a>  
            </div>
        </div>
    </div>
</header>

<script>
  function toggleDropdown() {
    const dropdown = document.getElementById("profileDropdown");
    dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
  }

  window.onclick = function(event) {
    if (!event.target.closest('.profile-button')) {
      const dropdown = document.getElementById("profileDropdown");
      if (dropdown && dropdown.style.display === "block") {
        dropdown.style.display = "none";
      }
    }
  }
</script>


  <!-- Booking Status Content -->
  <div class="container">
    <h1>Your Booking Status</h1>

    <div class="booking">
      <div class="booking-info">
        <p><strong>Spot:</strong> {{ ad.title }}</p>
        <p><strong>Date:</strong> {{ reservation.reservation_date }}</p>
        <p><strong>Time:</strong> {{ reservation.start_time }} - {{ reservation.end_time }}</p>
      </div>

      <div class="status {% if reservation.status == 'pending' %}pending{% elif reservation.status == 'confirmed' %}confirmed{% else %}rejected{% endif %}">
        {{ reservation.get_status_display }}
      </div>
    </div>

    
</body>
</html>
