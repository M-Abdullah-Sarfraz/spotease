<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Status</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background-color: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
    }

    .box h2 {
      color: #002b5c;
      font-size: 24px;
      margin-bottom: 15px;
    }

    .box p {
      color: #555;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .box img {
      width: 120px;
      margin-bottom: 20px;
    }

    .spinner {
      margin: 20px auto;
      border: 6px solid #e0e0e0;
      border-top: 6px solid #002b5c;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 3s linear infinite;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background-color: #002b5c;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #004080;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="https://cdn-icons-png.flaticon.com/512/5958/5958528.png" alt="Clock Icon" />
    
    <!-- Spinner for waiting process -->
    <div class="spinner"></div>

    <h2>Booking in Verification</h2>
    <p>Your booking is in the verification process. Please wait while we confirm the details.</p>
    
    <!-- If you want a link to go back to the homepage -->
    <a href="{% url 'home:home' %}" class="btn">Go to Home</a>
  </div>
</body>
</html>
