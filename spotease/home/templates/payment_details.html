{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Payment Details</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7fa;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
            text-align: center;
        }

        h2 {
            color: #1a1a1a;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .info {
            font-size: 15px;
            color: #333;
            margin: 4px 0;
        }

        .upload-section {
            text-align: center;
        }

        .upload-section input[type="file"] {
            margin-top: 15px;
        }

        .screenshot-preview {
            margin-top: 20px;
            max-width: 300px;
            display: none;
            border: 2px solid #ccc;
            border-radius: 8px;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        .checkout-button {
            background-color: #002b5c;
            color: #fff;
            padding: 14px 30px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .checkout-button:hover {
            background-color: #004080;
        }

        hr {
            border: none;
            border-top: 1px solid #dcdcdc;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Bank Transfer Details -->
        <div class="section">
            <h2>Bank Transfer</h2>
            <p class="info"><strong>Account Holder:</strong> {{ ad.account_holder_name }}</p>
            <p class="info"><strong>Account Number:</strong> {{ ad.account_number }}</p>
            <p class="info"><strong>Bank:</strong> {{ ad.bank }}</p>
        </div>

        <hr />

        <!-- Upload Payment Screenshot -->
        <div class="upload-section">
            <h2>Upload Payment Screenshot</h2>

            <!-- Form to Upload Screenshot -->
            <form action="{% url 'home:payment-details' spot_id=ad.id %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="file" name="screenshot" accept="image/*" onchange="previewScreenshot(event)" required>
                <img id="screenshot-preview" class="screenshot-preview" alt="Screenshot Preview"/>
                <div class="button-container">
                    <button type="submit" class="checkout-button">Upload</button>
                </div>
            </form>
            
        </div>
    </div>

    <script>
        function previewScreenshot(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function () {
                const preview = document.getElementById('screenshot-preview');
                preview.src = reader.result;
                preview.style.display = 'block';
            };
            if (file) {
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
